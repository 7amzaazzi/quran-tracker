<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل متابعة الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF7EC;--ink:#2B2420;--ink-soft:#6B6254;
  --emerald:#1F5E4E;--emerald-dim:#E8F0ED;--emerald-strong:#164438;
  --gold:#B8923F;--border:#DED5BC;--danger:#A33B2E;--card:#FFFDF7;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A1714;--ink:#EDE7D9;--ink-soft:#A69C8A;
    --emerald:#4FA98C;--emerald-dim:#213832;--emerald-strong:#7FCBB2;
    --gold:#D4B165;--border:#3A332A;--danger:#D97464;--card:#211D18;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Tajawal',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}

/* ── Login page ── */
#login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.login-box{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:36px 32px;width:min(360px,100%);text-align:center;
}
.login-box h1{font-family:'Amiri',serif;color:var(--emerald-strong);margin:0 0 6px;font-size:1.8rem;}
.login-box p{color:var(--ink-soft);margin:0 0 24px;font-size:.92rem;}
.login-box input{
  width:100%;margin-bottom:10px;display:block;
  font-family:inherit;font-size:.95rem;color:var(--ink);
  background:var(--paper);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;
}
.login-box input:focus{outline:2px solid var(--emerald);outline-offset:1px;}
.login-box button{width:100%;margin-top:6px;}
#login-error{color:var(--danger);font-size:.85rem;margin-top:8px;min-height:18px;}

/* ── Main app ── */
#app-page{display:none;}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 60px;}
.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;}
h1{font-family:'Amiri',serif;font-weight:700;font-size:2.1rem;margin:0;color:var(--emerald-strong);}
.sub{color:var(--ink-soft);margin:0 0 24px;font-size:.95rem;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
input,select,textarea{
  font-family:inherit;font-size:.95rem;color:var(--ink);
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--emerald);outline-offset:1px;}
#search{flex:1;min-width:160px;}
button{font-family:inherit;font-size:.92rem;cursor:pointer;border-radius:8px;padding:9px 16px;border:1px solid transparent;}
.btn-primary{background:var(--emerald);color:#fff;font-weight:500;}
.btn-primary:hover{background:var(--emerald-strong);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
.btn-ghost:hover{border-color:var(--emerald);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-small{padding:5px 11px;font-size:.82rem;}
.btn-logout{padding:7px 14px;font-size:.82rem;color:var(--ink-soft);border:1px solid var(--border);background:transparent;border-radius:8px;cursor:pointer;}
.btn-logout:hover{color:var(--danger);border-color:var(--danger);}
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);border:1px dashed var(--border);border-radius:12px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;}
.row:hover{background:var(--emerald-dim);}
.name{font-weight:700;font-size:1.02rem;flex:1 1 140px;min-width:0;}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft);}
.stats b{color:var(--ink);font-weight:700;}
.chev{color:var(--ink-soft);transition:transform .15s;}
.card.open .chev{transform:rotate(90deg);}
.detail{display:none;border-top:1px solid var(--border);padding:14px 16px 18px;}
.card.open .detail{display:block;}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin-bottom:14px;}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--border);}
th{color:var(--ink-soft);font-weight:500;}
.badge{padding:2px 8px;border-radius:20px;font-size:.78rem;}
.badge.present{background:var(--emerald-dim);color:var(--emerald-strong);}
.badge.late{background:#F3E6C4;color:#8A6A1F;}
.badge.absent{background:#F5DEDA;color:var(--danger);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px;}
.form-grid textarea{grid-column:1/-1;min-height:50px;resize:vertical;}
.detail-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
dialog{border:none;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(420px,90vw);}
dialog::backdrop{background:rgba(0,0,0,.45);}
.dlg-inner{padding:22px;}
.dlg-inner h3{margin-top:0;font-family:'Amiri',serif;color:var(--emerald-strong);}
.dlg-actions{display:flex;justify-content:left;gap:8px;margin-top:14px;}
.dlg-form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px;}
.dlg-form-grid textarea{grid-column:1/-1;min-height:50px;resize:vertical;}
.dlg-form-grid input,.dlg-form-grid select,.dlg-form-grid textarea{font-family:inherit;font-size:.92rem;color:var(--ink);background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:7px 10px;}
.confirm-msg{color:var(--ink-soft);font-size:.95rem;margin:8px 0 0;}
.card.archived{opacity:.6;border-style:dashed;}
.badge-archived{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:.76rem;background:#EDE7D9;color:#6B6254;border:1px solid #DED5BC;}
.section-title{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.toggle-archive{font-size:.82rem;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:4px 0;text-decoration:underline;}
.toggle-archive:hover{color:var(--emerald);}
#sync-bar{
  position:fixed;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px 16px;font-size:.82rem;font-family:'Tajawal',sans-serif;
  background:var(--card);border-top:1px solid var(--border);
  transition:opacity .3s;z-index:50;
}
#sync-dot{width:8px;height:8px;border-radius:50%;background:#aaa;flex-shrink:0;}
#sync-bar.synced #sync-dot{background:#27ae60;}
#sync-bar.syncing #sync-dot{background:var(--gold);animation:pulse 1s infinite;}
#sync-bar.error #sync-dot{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
@media(max-width:480px){.stats{font-size:.76rem;gap:10px;}h1{font-size:1.7rem;}}
</style>
</head>
<body>

<!-- ── Login page ── -->
<div id="login-page">
  <div class="login-box">
    <h1>📖 مدرسة التفوق</h1>
    <p>سجّل دخولك للمتابعة</p>
    <input id="l-email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="l-pass" type="password" placeholder="كلمة السر" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">دخول</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ── Main app ── -->
<div id="app-page">
  <div class="wrap">
    <div class="header-row">
      <div>
        <h1>سجل متابعة الطلاب</h1>
        <p class="sub">نظرة واحدة على حفظ وتجويد ومراجعة وحضور جميع الطلاب</p>
      </div>
      <button class="btn-logout" onclick="doLogout()">خروج ↩</button>
    </div>
    <div class="toolbar">
      <input id="search" type="text" placeholder="ابحث عن طالب…">
      <button class="btn-ghost" id="btn-toggle-archived" onclick="toggleShowArchived()">عرض المؤرشفين</button>
      <button class="btn-primary" onclick="openAddStudent()">+ إضافة طالب</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<div id="sync-bar" class="syncing" style="display:none;">
  <span id="sync-dot"></span>
  <span id="sync-msg">جارٍ الاتصال…</span>
</div>

<!-- Dialogs -->
<dialog id="addDlg">
  <div class="dlg-inner">
    <h3>طالب جديد</h3>
    <input id="newName" type="text" placeholder="اسم الطالب" style="width:100%">
    <div class="dlg-actions">
      <button class="btn-primary" onclick="confirmAddStudent()">إضافة</button>
      <button class="btn-ghost" onclick="document.getElementById('addDlg').close()">إلغاء</button>
    </div>
  </div>
</dialog>

<dialog id="editDlg">
  <div class="dlg-inner">
    <h3>تعديل الجلسة</h3>
    <div class="dlg-form-grid">
      <input type="date" id="e-date">
      <input type="text" id="e-surah" placeholder="السورة">
      <input type="number" id="e-hifz" placeholder="حفظ /10" min="0" max="10" step="0.5">
      <input type="number" id="e-tajwid" placeholder="تجويد /10" min="0" max="10" step="0.5">
      <input type="number" id="e-murajaa" placeholder="مراجعة /10" min="0" max="10" step="0.5">
      <select id="e-attendance">
        <option value="present">حاضر</option>
        <option value="late">متأخر</option>
        <option value="absent">غائب</option>
      </select>
      <textarea id="e-note" placeholder="ملاحظة (اختياري)"></textarea>
    </div>
    <div class="dlg-actions">
      <button class="btn-primary" onclick="saveEditSession()">حفظ التعديلات</button>
      <button class="btn-ghost" onclick="document.getElementById('editDlg').close()">إلغاء</button>
    </div>
  </div>
</dialog>

<dialog id="confirmDlg">
  <div class="dlg-inner">
    <h3 id="confirm-title">تأكيد</h3>
    <p class="confirm-msg" id="confirm-msg"></p>
    <div class="dlg-actions">
      <button class="btn-danger" id="confirm-ok-btn" onclick="confirmDlgOk()">تأكيد</button>
      <button class="btn-ghost" onclick="document.getElementById('confirmDlg').close()">إلغاء</button>
    </div>
  </div>
</dialog>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ── Firebase init ── */
firebase.initializeApp({
  apiKey:"AIzaSyCP9-owB4MlWFQyWsTuoibXDn9BnzST0R0",
  authDomain:"quran-tracker-38786.firebaseapp.com",
  projectId:"quran-tracker-38786",
  storageBucket:"quran-tracker-38786.firebasestorage.app",
  messagingSenderId:"907068704684",
  appId:"1:907068704684:web:53715f5602fdb696ab5c09"
});
const auth = firebase.auth();
const db   = firebase.firestore();
const COL  = 'students';
const ADMIN_EMAIL = 'hamza.azzi06@gmail.com';

/* ── Auth state ── */
auth.onAuthStateChanged(user => {
  if(user && user.email === ADMIN_EMAIL){
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('app-page').style.display   = 'block';
    document.getElementById('sync-bar').style.display   = 'flex';
    startListener();
  } else {
    if(user) auth.signOut(); // غير مصرح له
    document.getElementById('login-page').style.display = 'flex';
    document.getElementById('app-page').style.display   = 'none';
    document.getElementById('sync-bar').style.display   = 'none';
  }
});

/* ── Login / Logout ── */
async function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e){
    errEl.textContent = 'البريد أو كلمة السر غير صحيحة.';
  }
}
function doLogout(){ auth.signOut(); }

// تسجيل دخول بضغط Enter
document.getElementById('l-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

/* ── Firestore listener ── */
let students=[], unsubscribe=null;
let openId=null, searchTerm='', showArchived=false;

function startListener(){
  if(unsubscribe) unsubscribe();
  setSyncStatus('syncing','جارٍ الاتصال بالسحابة…');
  unsubscribe = db.collection(COL).onSnapshot(snap=>{
    students = snap.docs.map(d=>({id:d.id,...d.data()}));
    setSyncStatus('synced','متزامن مع السحابة ✓');
    render();
  }, err=>{
    setSyncStatus('error','تعذّر الاتصال — تحقق من الإنترنت');
  });
}

/* ── Sync bar ── */
function setSyncStatus(state,msg){
  const bar=document.getElementById('sync-bar');
  bar.className=state;
  document.getElementById('sync-msg').textContent=msg;
}

/* ── Helpers ── */
function uid(){ return db.collection(COL).doc().id; }
function avg(arr){ return arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length):null; }
function fmt(n){ return n===null?'—':n.toFixed(1); }
function esc(str){ return(str+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function studentStats(s){
  const sess=s.sessions||[];
  const hifz=avg(sess.map(x=>x.hifz).filter(x=>x!=null));
  const tajwid=avg(sess.map(x=>x.tajwid).filter(x=>x!=null));
  const murajaa=avg(sess.map(x=>x.murajaa).filter(x=>x!=null));
  const present=sess.filter(x=>x.attendance==='present').length;
  const attendanceRate=sess.length?Math.round(present/sess.length*100):null;
  const last=sess.length?sess[sess.length-1].date:null;
  return{hifz,tajwid,murajaa,attendanceRate,last,count:sess.length};
}

/* ── Firestore writes ── */
async function fsUpdate(sid,data){
  setSyncStatus('syncing','جارٍ الحفظ…');
  await db.collection(COL).doc(sid).update(data);
}
async function fsDelete(sid){
  setSyncStatus('syncing','جارٍ الحذف…');
  await db.collection(COL).doc(sid).delete();
}

/* ── Render ── */
function renderCard(s){
  const st=studentStats(s);
  const open=openId===s.id;
  const isArchived=!!s.archived;
  return`<div class="card ${open?'open':''} ${isArchived?'archived':''}" id="card-${s.id}">
    <div class="row" onclick="toggleStudent('${s.id}')">
      <span class="chev">◂</span>
      <span class="name">${esc(s.name)}${isArchived?' <span class="badge-archived">📦 مؤرشف</span>':''}</span>
      <div class="stats">
        <span>حفظ: <b>${fmt(st.hifz)}</b></span>
        <span>تجويد: <b>${fmt(st.tajwid)}</b></span>
        <span>مراجعة: <b>${fmt(st.murajaa)}</b></span>
        <span>حضور: <b>${st.attendanceRate===null?'—':st.attendanceRate+'%'}</b></span>
        <span>آخر جلسة: <b>${st.last||'—'}</b></span>
      </div>
    </div>
    <div class="detail">${open?renderDetail(s):''}</div>
  </div>`;
}

function render(){
  const listEl=document.getElementById('list');
  const q=searchTerm.toLowerCase();
  const all=students.filter(s=>s.name.toLowerCase().includes(q));
  const active=all.filter(s=>!s.archived).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const archived=all.filter(s=>s.archived).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const btn=document.getElementById('btn-toggle-archived');
  if(btn) btn.textContent=showArchived?'إخفاء المؤرشفين':'عرض المؤرشفين';
  if(students.length===0){listEl.innerHTML='<div class="empty">جارٍ تحميل البيانات…</div>';return;}
  if(all.length===0){listEl.innerHTML='<div class="empty">لا توجد نتائج مطابقة.</div>';return;}
  let html='';
  if(active.length){
    html+=`<div class="section-title">الطلاب النشطون (${active.length})</div>`;
    html+=active.map(renderCard).join('');
  }
  if(showArchived&&archived.length){
    html+=`<div class="section-title">الأرشيف (${archived.length})</div>`;
    html+=archived.map(renderCard).join('');
  }
  if(!active.length&&!showArchived&&archived.length){
    html+=`<div class="empty">جميع الطلاب في الأرشيف. <button class="toggle-archive" onclick="toggleShowArchived()">عرض المؤرشفين</button></div>`;
  }
  listEl.innerHTML=html;
}

function toggleShowArchived(){showArchived=!showArchived;render();}
function toggleStudent(id){openId=openId===id?null:id;render();}

function renderDetail(s){
  const sessions=s.sessions||[];
  const rows=sessions.slice().reverse().map(sess=>{
    const bc=sess.attendance==='present'?'present':sess.attendance==='late'?'late':'absent';
    const bt=sess.attendance==='present'?'حاضر':sess.attendance==='late'?'متأخر':'غائب';
    return`<tr>
      <td>${sess.date}</td><td>${esc(sess.surah||'—')}</td>
      <td>${sess.hifz??'—'}</td><td>${sess.tajwid??'—'}</td><td>${sess.murajaa??'—'}</td>
      <td><span class="badge ${bc}">${bt}</span></td>
      <td style="color:var(--ink-soft)">${esc(sess.note||'')}</td>
      <td style="display:flex;gap:4px;flex-wrap:nowrap">
        <button class="btn-ghost btn-small" onclick="openEditSession('${s.id}','${sess.id}')">تعديل</button>
        <button class="btn-danger btn-small" onclick="askDeleteSession('${s.id}','${sess.id}')">حذف</button>
      </td>
    </tr>`;
  }).join('');
  const table=sessions.length
    ?`<table><thead><tr><th>التاريخ</th><th>السورة</th><th>حفظ</th><th>تجويد</th><th>مراجعة</th><th>الحضور</th><th>ملاحظة</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    :`<p style="color:var(--ink-soft);font-size:.88rem">لا توجد جلسات مسجلة بعد.</p>`;
  const isArchived=!!s.archived;
  const sessionForm=isArchived
    ?`<p style="color:var(--ink-soft);font-size:.86rem;margin:10px 0 6px;">📦 هذا الطالب في الأرشيف — لا يمكن إضافة جلسات جديدة.</p>`
    :`<div class="form-grid">
      <input type="date" id="f-date-${s.id}" value="${new Date().toISOString().slice(0,10)}">
      <input type="text" id="f-surah-${s.id}" placeholder="السورة">
      <input type="number" id="f-hifz-${s.id}" placeholder="حفظ /10" min="0" max="10" step="0.5">
      <input type="number" id="f-tajwid-${s.id}" placeholder="تجويد /10" min="0" max="10" step="0.5">
      <input type="number" id="f-murajaa-${s.id}" placeholder="مراجعة /10" min="0" max="10" step="0.5">
      <select id="f-attendance-${s.id}">
        <option value="present">حاضر</option><option value="late">متأخر</option><option value="absent">غائب</option>
      </select>
      <textarea id="f-note-${s.id}" placeholder="ملاحظة سلوك أو ملاحظات (اختياري)"></textarea>
    </div>`;
  const archiveBtn=isArchived
    ?`<button class="btn-ghost btn-small" onclick="askUnarchiveStudent('${s.id}')">♻️ إلغاء الأرشفة</button>`
    :`<button class="btn-ghost btn-small" onclick="askArchiveStudent('${s.id}')">📦 أرشفة</button>`;
  return`${table}${sessionForm}
  <div class="detail-actions">
    ${isArchived?'':`<button class="btn-primary btn-small" onclick="addSession('${s.id}')">+ تسجيل جلسة</button>`}
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${archiveBtn}
      <button class="btn-danger btn-small" onclick="askDeleteStudent('${s.id}')">حذف الطالب</button>
    </div>
  </div>`;
}

/* ── Add student ── */
function openAddStudent(){document.getElementById('newName').value='';document.getElementById('addDlg').showModal();}
async function confirmAddStudent(){
  const name=document.getElementById('newName').value.trim();
  if(!name) return;
  document.getElementById('addDlg').close();
  await db.collection(COL).add({name,sessions:[],archived:false,archivedAt:null});
}

/* ── Add session ── */
async function addSession(sid){
  const s=students.find(x=>x.id===sid);if(!s) return;
  const g=(id)=>document.getElementById(id).value;
  const num=(v)=>v===''?null:parseFloat(v);
  const newSess={
    id:uid(),
    date:g(`f-date-${sid}`)||new Date().toISOString().slice(0,10),
    surah:g(`f-surah-${sid}`),
    hifz:num(g(`f-hifz-${sid}`)),
    tajwid:num(g(`f-tajwid-${sid}`)),
    murajaa:num(g(`f-murajaa-${sid}`)),
    attendance:g(`f-attendance-${sid}`),
    note:g(`f-note-${sid}`)
  };
  await fsUpdate(sid,{sessions:[...(s.sessions||[]),newSess]});
}

/* ── Edit session ── */
let editCtx={sid:null,sessId:null};
function openEditSession(sid,sessId){
  const s=students.find(x=>x.id===sid);if(!s) return;
  const sess=(s.sessions||[]).find(x=>x.id===sessId);if(!sess) return;
  editCtx={sid,sessId};
  document.getElementById('e-date').value=sess.date||'';
  document.getElementById('e-surah').value=sess.surah||'';
  document.getElementById('e-hifz').value=sess.hifz??'';
  document.getElementById('e-tajwid').value=sess.tajwid??'';
  document.getElementById('e-murajaa').value=sess.murajaa??'';
  document.getElementById('e-attendance').value=sess.attendance||'present';
  document.getElementById('e-note').value=sess.note||'';
  document.getElementById('editDlg').showModal();
}
async function saveEditSession(){
  const{sid,sessId}=editCtx;
  const s=students.find(x=>x.id===sid);if(!s) return;
  const g=(id)=>document.getElementById(id).value;
  const num=(v)=>v===''?null:parseFloat(v);
  const updated=(s.sessions||[]).map(sess=>sess.id===sessId?{
    ...sess,date:g('e-date'),surah:g('e-surah'),
    hifz:num(g('e-hifz')),tajwid:num(g('e-tajwid')),murajaa:num(g('e-murajaa')),
    attendance:g('e-attendance'),note:g('e-note')
  }:sess);
  document.getElementById('editDlg').close();
  await fsUpdate(sid,{sessions:updated});
}

/* ── Confirm dialog ── */
let confirmCb=null;
function showConfirm(title,msg,cb,okLabel='حذف'){
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-msg').textContent=msg;
  document.getElementById('confirm-ok-btn').textContent=okLabel;
  confirmCb=cb;
  document.getElementById('confirmDlg').showModal();
}
function confirmDlgOk(){
  document.getElementById('confirmDlg').close();
  if(confirmCb) confirmCb();
  confirmCb=null;
}

/* ── Delete ── */
function askDeleteSession(sid,sessId){
  const s=students.find(x=>x.id===sid);
  const sess=s&&(s.sessions||[]).find(x=>x.id===sessId);if(!sess) return;
  showConfirm('حذف الجلسة',
    `هل تريد حذف جلسة ${sess.date}${sess.surah?' — '+sess.surah:''}؟ لا يمكن التراجع.`,
    async()=>await fsUpdate(sid,{sessions:(s.sessions||[]).filter(x=>x.id!==sessId)})
  );
}
function askDeleteStudent(sid){
  const s=students.find(x=>x.id===sid);if(!s) return;
  showConfirm('حذف الطالب',
    `هل تريد حذف "${s.name}" وجميع جلساته (${(s.sessions||[]).length} جلسة)؟ لا يمكن التراجع.`,
    async()=>{if(openId===sid)openId=null;await fsDelete(sid);}
  );
}

/* ── Archive ── */
function askArchiveStudent(sid){
  const s=students.find(x=>x.id===sid);if(!s) return;
  showConfirm('أرشفة الطالب',
    `سيتم إخفاء "${s.name}" من القائمة وتجميد سجله. يمكن استرجاعه لاحقًا.`,
    async()=>await fsUpdate(sid,{archived:true,archivedAt:new Date().toISOString().slice(0,10)}),
    'أرشفة'
  );
}
function askUnarchiveStudent(sid){
  const s=students.find(x=>x.id===sid);if(!s) return;
  showConfirm('إلغاء الأرشفة',
    `هل تريد إعادة "${s.name}" إلى القائمة النشطة؟`,
    async()=>await fsUpdate(sid,{archived:false,archivedAt:null}),
    'تأكيد'
  );
}

document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value;render();});
</script>
